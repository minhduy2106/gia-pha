# Push lên main: chạy test, áp dụng migration D1, rồi deploy lên Cloudflare Pages (sogiapha.pages.dev).
# Cần 2 secret của repo: CLOUDFLARE_API_TOKEN (quyền D1: Edit và Cloudflare Pages: Edit) và CLOUDFLARE_ACCOUNT_ID.
# Chưa đặt secret thì chỉ chạy test, bỏ qua deploy.
name: Test and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Chưa có secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID, bỏ qua deploy."
            exit 0
          fi
          npx -y wrangler@4.50.0 d1 migrations apply giapha --remote
          npm run build
          npx -y wrangler@4.50.0 pages deploy --branch main --commit-dirty=true
